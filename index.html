<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1C2541" />
<title>字卡櫃 - 背單字</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  html, body { margin: 0; padding: 0; background: #1C2541; }
  * { box-sizing: border-box; }
  .serif { font-family: Georgia, "Noto Serif TC", serif; }
  .mono { font-family: "PT Mono", "Courier New", monospace; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid #E3A34E; outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const STORAGE_KEY = "vocab-words-v1";

const LEVELS = [
  { min: 0, max: 0, label: "生疏", color: "#D96C4F" },
  { min: 1, max: 2, label: "學習中", color: "#E3A34E" },
  { min: 3, max: 4, label: "熟悉", color: "#5B8FBF" },
  { min: 5, max: 5, label: "精熟", color: "#7FA87A" },
];

function levelOf(mastery) {
  return LEVELS.find((l) => mastery >= l.min && mastery <= l.max) || LEVELS[0];
}

const SEED_WORDS = [
  { id: "s1", term: "ubiquitous", meaning: "無所不在的", example: "Smartphones have become ubiquitous in modern life.", category: "形容詞", mastery: 0 },
  { id: "s2", term: "meticulous", meaning: "一絲不苟的、細心的", example: "She is meticulous about checking every detail.", category: "形容詞", mastery: 0 },
  { id: "s3", term: "procrastinate", meaning: "拖延", example: "I always procrastinate until the deadline is near.", category: "動詞", mastery: 0 },
];

// 本機儲存(取代 Claude 環境專用的 window.storage,改用瀏覽器 localStorage)
const localDB = {
  get(key) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  },
};

function VocabApp() {
  const [words, setWords] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("study");
  const [currentId, setCurrentId] = useState(null);
  const [mode, setMode] = useState("en2zh");
  const [direction, setDirection] = useState("en2zh");
  const [answer, setAnswer] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [isCorrect, setIsCorrect] = useState(false);
  const [sessionCount, setSessionCount] = useState(0);
  const [form, setForm] = useState({ term: "", meaning: "", example: "", category: "" });
  const [toast, setToast] = useState("");

  useEffect(() => {
    const saved = localDB.get(STORAGE_KEY);
    if (saved) {
      setWords(saved);
    } else {
      setWords(SEED_WORDS);
      localDB.set(STORAGE_KEY, SEED_WORDS);
    }
    setLoaded(true);
  }, []);

  const persist = useCallback((next) => {
    setWords(next);
    localDB.set(STORAGE_KEY, next);
  }, []);

  const pool = words.filter((w) => w.mastery < 5);

  const pickCard = useCallback(
    (excludeId) => {
      const candidates = pool.filter((w) => w.id !== excludeId);
      const source = candidates.length ? candidates : pool;
      if (!source.length) return null;
      return source[Math.floor(Math.random() * source.length)].id;
    },
    [pool]
  );

  function pickDirection() {
    if (mode === "mixed") return Math.random() < 0.5 ? "en2zh" : "zh2en";
    return mode;
  }

  useEffect(() => {
    if (loaded && view === "study" && currentId === null) {
      setCurrentId(pickCard(null));
      setDirection(pickDirection());
    }
    // eslint-disable-next-line
  }, [loaded, view, currentId, pickCard]);

  function switchMode(m) {
    setMode(m);
    setAnswer("");
    setSubmitted(false);
    setIsCorrect(false);
    const nextId = pickCard(null);
    setCurrentId(nextId);
    setDirection(m === "mixed" ? (Math.random() < 0.5 ? "en2zh" : "zh2en") : m);
  }

  const current = words.find((w) => w.id === currentId);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 1600);
  }

  function speak(text) {
    if (!text) return;
    if (!("speechSynthesis" in window)) {
      showToast("此瀏覽器不支援語音朗讀");
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  function normalize(str) {
    return (str || "").toLowerCase().replace(/[，,。.、\s()（）]/g, "");
  }

  function checkAnswer(e) {
    e.preventDefault();
    if (!current || submitted) return;
    const nAns = normalize(answer);
    const target = direction === "en2zh" ? current.meaning : current.term;
    const nTarget = normalize(target);
    const ok =
      nAns.length > 0 &&
      (nAns === nTarget ||
        (nAns.length >= 2 && nTarget.includes(nAns)) ||
        (nTarget.length >= 2 && nAns.includes(nTarget)));
    setIsCorrect(ok);
    setSubmitted(true);
  }

  function grade(known) {
    if (!current) return;
    const next = words.map((w) =>
      w.id === current.id
        ? { ...w, mastery: known ? Math.min(5, w.mastery + 1) : Math.max(0, w.mastery - 1) }
        : w
    );
    persist(next);
    setSessionCount((c) => c + 1);
    setAnswer("");
    setSubmitted(false);
    setIsCorrect(false);
    setCurrentId(pickCard(current.id));
    setDirection(pickDirection());
  }

  function addWord(e) {
    e.preventDefault();
    if (!form.term.trim() || !form.meaning.trim()) return;
    const w = {
      id: "w" + Date.now(),
      term: form.term.trim(),
      meaning: form.meaning.trim(),
      example: form.example.trim(),
      category: form.category.trim() || "未分類",
      mastery: 0,
    };
    persist([w, ...words]);
    setForm({ term: "", meaning: "", example: "", category: "" });
    showToast(`已加入「${w.term}」`);
  }

  function deleteWord(id) {
    persist(words.filter((w) => w.id !== id));
    if (currentId === id) setCurrentId(null);
  }

  function resetProgress(id) {
    persist(words.map((w) => (w.id === id ? { ...w, mastery: 0 } : w)));
  }

  const mastered = words.filter((w) => w.mastery === 5).length;

  return (
    <div style={{
      minHeight: "100vh",
      background: "#1C2541",
      backgroundImage: "radial-gradient(circle at 20% 10%, rgba(227,163,78,0.08), transparent 40%), radial-gradient(circle at 80% 90%, rgba(127,168,122,0.06), transparent 40%)",
      fontFamily: '"Noto Sans TC", system-ui, sans-serif',
      color: "#EDE8DC",
      padding: "28px 16px 60px",
    }}>
      <div style={{ maxWidth: 480, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 22 }}>
          <div>
            <h1 className="serif" style={{ fontSize: 26, margin: 0, letterSpacing: 0.5 }}>字卡櫃</h1>
            <p className="mono" style={{ fontSize: 11, color: "#8B93A8", margin: "4px 0 0" }}>CARD·CATALOG — 你的私人單字抽屜</p>
          </div>
          <div style={{ textAlign: "right" }} className="mono">
            <div style={{ fontSize: 12, color: "#8B93A8" }}>本次已複習</div>
            <div style={{ fontSize: 20, color: "#E3A34E" }}>🔥 {sessionCount}</div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          {[
            { key: "study", label: "📖 學習" },
            { key: "manage", label: "📚 單字庫" },
            { key: "add", label: "＋ 新增" },
          ].map(({ key, label }) => (
            <button key={key} onClick={() => setView(key)} style={{
              flex: 1, padding: "10px 0", borderRadius: 8,
              border: "1px solid " + (view === key ? "#E3A34E" : "rgba(237,232,220,0.15)"),
              background: view === key ? "rgba(227,163,78,0.14)" : "transparent",
              color: view === key ? "#E3A34E" : "#EDE8DC", fontSize: 13, cursor: "pointer",
            }}>{label}</button>
          ))}
        </div>

        {view === "study" && (
          <div>
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {[{ key: "en2zh", label: "英 → 中" }, { key: "zh2en", label: "中 → 英" }, { key: "mixed", label: "混合" }].map(({ key, label }) => (
                <button key={key} onClick={() => switchMode(key)} className="mono" style={{
                  flex: 1, padding: "7px 0", borderRadius: 6, fontSize: 12, cursor: "pointer",
                  border: "1px solid " + (mode === key ? "#5B8FBF" : "rgba(237,232,220,0.15)"),
                  background: mode === key ? "rgba(91,143,191,0.16)" : "transparent",
                  color: mode === key ? "#8FB8E0" : "#8B93A8",
                }}>{label}</button>
              ))}
            </div>

            {!words.length ? (
              <EmptyState onAdd={() => setView("add")} />
            ) : !pool.length ? (
              <div style={{ textAlign: "center", padding: "50px 20px", border: "1px dashed rgba(237,232,220,0.25)", borderRadius: 12 }}>
                <p className="serif" style={{ fontSize: 20, marginBottom: 8 }}>全部精熟了！</p>
                <p style={{ fontSize: 13, color: "#8B93A8", marginBottom: 16 }}>目前抽屜裡的單字都已達到精熟等級。</p>
                <button onClick={() => setView("add")} style={btnStyle("#E3A34E", "#1C2541")}>新增更多單字</button>
              </div>
            ) : current ? (
              <>
                <div style={{
                  position: "relative", background: "#F5F1E8", color: "#1C2541", borderRadius: 10, minHeight: 260,
                  padding: "28px 24px", boxShadow: "0 18px 40px rgba(0,0,0,0.35)", display: "flex",
                  flexDirection: "column", justifyContent: "center", alignItems: "center", textAlign: "center",
                }}>
                  <div style={{ position: "absolute", top: 14, left: 14, width: 12, height: 12, borderRadius: "50%", background: "#1C2541", boxShadow: "inset 0 0 0 2px #F5F1E8" }} />
                  <span className="mono" style={{ position: "absolute", top: 16, right: 16, fontSize: 10, padding: "3px 8px", borderRadius: 20, color: "#fff", background: levelOf(current.mastery).color }}>
                    {levelOf(current.mastery).label} · {current.mastery}/5
                  </span>

                  <p className="mono" style={{ fontSize: 11, color: "#8B93A8", marginBottom: 10 }}>
                    {current.category} · {direction === "en2zh" ? "英翻中" : "中翻英"}
                  </p>

                  {direction === "en2zh" ? (
                    <button onClick={() => speak(current.term)} title="點擊發音" style={{ background: "transparent", border: "none", cursor: "pointer", padding: 0, display: "inline-flex", alignItems: "center", gap: 8, color: "inherit" }}>
                      <h2 className="serif" style={{ fontSize: 34, margin: 0, wordBreak: "break-word" }}>{current.term}</h2>
                      <span style={{ fontSize: 20 }}>🔊</span>
                    </button>
                  ) : (
                    <h2 className="serif" style={{ fontSize: 26, margin: 0, wordBreak: "break-word" }}>{current.meaning}</h2>
                  )}

                  <p style={{ fontSize: 12, color: "#8B93A8", marginTop: 18 }}>
                    {direction === "en2zh" ? "請輸入這個單字的中文意思" : "請輸入這個意思對應的英文單字"}
                  </p>

                  <form onSubmit={checkAnswer} style={{ width: "100%", marginTop: 14 }}>
                    <input
                      autoFocus value={answer} disabled={submitted}
                      onChange={(e) => setAnswer(e.target.value)}
                      placeholder={direction === "en2zh" ? "在這裡輸入中文意思..." : "type the English word..."}
                      style={{
                        width: "100%", textAlign: "center", fontSize: 16, padding: "12px 14px", borderRadius: 8,
                        border: `1.5px solid ${submitted ? (isCorrect ? "#7FA87A" : "#D96C4F") : "rgba(28,37,65,0.25)"}`,
                        background: submitted ? (isCorrect ? "rgba(127,168,122,0.12)" : "rgba(217,108,79,0.1)") : "#fff",
                        color: "#1C2541",
                      }}
                    />
                    {!submitted && (
                      <button type="submit" style={{ ...btnStyle("#1C2541", "#F5F1E8"), marginTop: 10 }}>送出答案</button>
                    )}
                  </form>

                  {submitted && (
                    <div style={{ marginTop: 14, width: "100%" }}>
                      <p className="serif" style={{ fontSize: 17, margin: 0, color: isCorrect ? "#4C7A49" : "#B4432E", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                        {isCorrect ? "✓" : "✕"} {isCorrect ? "答對了！" : "正確答案："}
                        {!isCorrect && (direction === "en2zh" ? current.meaning : current.term)}
                        {direction === "zh2en" && (
                          <span style={{ cursor: "pointer", marginLeft: 4 }} onClick={() => speak(current.term)}>🔊</span>
                        )}
                      </p>
                      {current.example && (
                        <p style={{ fontSize: 13.5, color: "#4A5568", lineHeight: 1.6, fontStyle: "italic", marginTop: 10 }}>「{current.example}」</p>
                      )}
                    </div>
                  )}
                </div>

                {submitted ? (
                  <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
                    <button onClick={() => grade(false)} style={{ ...btnStyle("transparent", "#D96C4F"), border: "1.5px solid #D96C4F", flex: 1 }}>✕ 算我錯</button>
                    <button onClick={() => grade(true)} style={{ ...btnStyle("#7FA87A", "#1C2541"), flex: 1 }}>✓ 算我對</button>
                  </div>
                ) : (
                  <p style={{ textAlign: "center", fontSize: 11, color: "#8B93A8", marginTop: 14 }}>輸入後按 Enter 或「送出答案」查看結果</p>
                )}
                <p style={{ textAlign: "center", fontSize: 11, color: "#8B93A8", marginTop: 8 }}>抽屜中還有 {pool.length} 張卡待複習 · 共 {words.length} 張</p>
              </>
            ) : null}
          </div>
        )}

        {view === "manage" && (
          <div>
            <div style={{ display: "flex", gap: 12, marginBottom: 16 }} className="mono">
              <StatChip label="總數" value={words.length} />
              <StatChip label="精熟" value={mastered} color="#7FA87A" />
              <StatChip label="待複習" value={pool.length} color="#E3A34E" />
            </div>
            {!words.length && <EmptyState onAdd={() => setView("add")} />}
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {words.map((w) => (
                <div key={w.id} style={{
                  border: "1px solid rgba(237,232,220,0.15)", borderLeft: `4px solid ${levelOf(w.mastery).color}`,
                  borderRadius: 8, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
                }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                      <span className="serif" style={{ fontSize: 17 }}>{w.term}</span>
                      <span className="mono" style={{ fontSize: 10, color: "#8B93A8" }}>{w.category}</span>
                    </div>
                    <div style={{ fontSize: 13, color: "#C9C3B5", marginTop: 2 }}>{w.meaning}</div>
                  </div>
                  <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                    <button onClick={() => speak(w.term)} title="發音" style={iconBtnStyle}>🔊</button>
                    <button onClick={() => resetProgress(w.id)} title="重設進度" style={iconBtnStyle}>↺</button>
                    <button onClick={() => deleteWord(w.id)} title="刪除" style={{ ...iconBtnStyle, color: "#D96C4F" }}>🗑</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {view === "add" && (
          <form onSubmit={addWord} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Field label="單字 *" value={form.term} onChange={(v) => setForm((f) => ({ ...f, term: v }))} placeholder="例如：resilient" />
            <Field label="中文意思 *" value={form.meaning} onChange={(v) => setForm((f) => ({ ...f, meaning: v }))} placeholder="例如：有韌性的" />
            <Field label="例句" value={form.example} onChange={(v) => setForm((f) => ({ ...f, example: v }))} placeholder="選填" textarea />
            <Field label="分類" value={form.category} onChange={(v) => setForm((f) => ({ ...f, category: v }))} placeholder="例如：形容詞、多益、旅遊" />
            <button type="submit" style={btnStyle("#E3A34E", "#1C2541")}>＋ 加入抽屜</button>
          </form>
        )}
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "#F5F1E8", color: "#1C2541", padding: "8px 16px", borderRadius: 20, fontSize: 13, boxShadow: "0 8px 20px rgba(0,0,0,0.3)" }}>{toast}</div>
      )}
    </div>
  );
}

function EmptyState({ onAdd }) {
  return (
    <div style={{ textAlign: "center", padding: "50px 20px", border: "1px dashed rgba(237,232,220,0.25)", borderRadius: 12 }}>
      <p className="serif" style={{ fontSize: 18, marginBottom: 6 }}>抽屜是空的</p>
      <p style={{ fontSize: 13, color: "#8B93A8", marginBottom: 16 }}>新增第一張單字卡，開始建立你的字卡庫。</p>
      <button onClick={onAdd} style={btnStyle("#E3A34E", "#1C2541")}>＋ 新增單字</button>
    </div>
  );
}

function StatChip({ label, value, color = "#EDE8DC" }) {
  return (
    <div style={{ flex: 1, textAlign: "center", border: "1px solid rgba(237,232,220,0.15)", borderRadius: 8, padding: "8px 0" }}>
      <div style={{ fontSize: 18, color }}>{value}</div>
      <div style={{ fontSize: 10, color: "#8B93A8" }}>{label}</div>
    </div>
  );
}

function Field({ label, value, onChange, placeholder, textarea }) {
  const Tag = textarea ? "textarea" : "input";
  return (
    <label style={{ display: "block" }}>
      <span style={{ fontSize: 12, color: "#8B93A8", display: "block", marginBottom: 5 }}>{label}</span>
      <Tag value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} rows={textarea ? 3 : undefined}
        style={{ width: "100%", background: "rgba(245,241,232,0.06)", border: "1px solid rgba(237,232,220,0.2)", borderRadius: 8, padding: "10px 12px", color: "#EDE8DC", fontSize: 14, fontFamily: "inherit", resize: textarea ? "vertical" : undefined }} />
    </label>
  );
}

function btnStyle(bg, fg) {
  return { background: bg, color: fg, border: bg === "transparent" ? undefined : "none", borderRadius: 8, padding: "11px 0", fontSize: 14, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", width: "100%" };
}

const iconBtnStyle = { background: "transparent", border: "1px solid rgba(237,232,220,0.2)", borderRadius: 6, padding: 6, color: "#EDE8DC", cursor: "pointer" };

ReactDOM.createRoot(document.getElementById("root")).render(<VocabApp />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
