<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1C2541" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>字卡櫃 - 背單字</title>
<style>
  html, body { margin: 0; padding: 0; background: #1C2541; }
  * { box-sizing: border-box; }
  body { font-family: "Noto Sans TC", system-ui, sans-serif; }
  .serif { font-family: Georgia, "Noto Serif TC", serif; }
  .mono { font-family: "PT Mono", "Courier New", monospace; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid #E3A34E; outline-offset: 2px;
  }
  input, textarea { font-family: inherit; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------- */
  /* 常數與工具函式                                                     */
  /* ---------------------------------------------------------------- */
  var STORAGE_KEY = "vocab-words-v1";
  var STREAK_KEY = "vocab-streak-v1";
  var REMINDER_KEY = "vocab-reminders-v1";
  var REMINDED_KEY = "vocab-reminded-date-v1";
  var INTERVALS = [0, 1, 2, 4, 7, 14];

  var LEVELS = [
    { min: 0, max: 0, label: "生疏", color: "#D96C4F" },
    { min: 1, max: 2, label: "學習中", color: "#E3A34E" },
    { min: 3, max: 4, label: "熟悉", color: "#5B8FBF" },
    { min: 5, max: 5, label: "精熟", color: "#7FA87A" },
  ];

  function levelOf(mastery) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (mastery >= LEVELS[i].min && mastery <= LEVELS[i].max) return LEVELS[i];
    }
    return LEVELS[0];
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return String(n).padStart(2, "0"); }

  function addDays(dateStr, days) {
    var parts = dateStr.split("-").map(Number);
    var dt = new Date(parts[0], parts[1] - 1, parts[2]);
    dt.setDate(dt.getDate() + days);
    return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());
  }

  function computeStreak(prev) {
    var today = todayStr();
    if (prev.lastStudyDate === today) return prev;
    var yesterday = addDays(today, -1);
    var newCount = prev.lastStudyDate === yesterday ? (prev.count || 0) + 1 : 1;
    return { count: newCount, longest: Math.max(newCount, prev.longest || 0), lastStudyDate: today };
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function normalize(str) {
    return (str || "").toLowerCase().replace(/[，,。.、\s()（）]/g, "");
  }
  function normalizeSpelling(str) {
    return (str || "").trim().toLowerCase().replace(/\s+/g, " ");
  }

  var SEED_WORDS = [
    { id: "s1", term: "ubiquitous", meaning: "無所不在的", example: "Smartphones have become ubiquitous in modern life.", category: "形容詞", mastery: 0, nextReview: todayStr(), lastReviewed: null },
    { id: "s2", term: "meticulous", meaning: "一絲不苟的、細心的", example: "She is meticulous about checking every detail.", category: "形容詞", mastery: 0, nextReview: todayStr(), lastReviewed: null },
    { id: "s3", term: "procrastinate", meaning: "拖延", example: "I always procrastinate until the deadline is near.", category: "動詞", mastery: 0, nextReview: todayStr(), lastReviewed: null },
  ];

  function loadJSON(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  /* ---------------------------------------------------------------- */
  /* 全域狀態                                                           */
  /* ---------------------------------------------------------------- */
  var state = {
    words: loadJSON(STORAGE_KEY, null) || SEED_WORDS,
    view: "study",
    currentId: null,
    mode: "en2zh",
    direction: "en2zh",
    categoryFilter: "all",
    dueOnly: true,
    streak: loadJSON(STREAK_KEY, { count: 0, longest: 0, lastStudyDate: null }),
    remindersOn: loadJSON(REMINDER_KEY, false),
    submitted: false,
    isCorrect: false,
    sessionCount: 0,
    editingId: null,
    toast: "",
  };
  if (!loadJSON(STORAGE_KEY, null)) saveJSON(STORAGE_KEY, SEED_WORDS);

  function persistWords() { saveJSON(STORAGE_KEY, state.words); }
  function persistStreak() { saveJSON(STREAK_KEY, state.streak); }

  function getPool() {
    return state.words.filter(function (w) {
      return w.mastery < 5 &&
        (state.categoryFilter === "all" || w.category === state.categoryFilter) &&
        (!state.dueOnly || w.nextReview <= todayStr());
    });
  }
  function getCategories() {
    var set = {};
    state.words.forEach(function (w) { if (w.category) set[w.category] = true; });
    return Object.keys(set);
  }
  function getCurrent() {
    for (var i = 0; i < state.words.length; i++) {
      if (state.words[i].id === state.currentId) return state.words[i];
    }
    return null;
  }
  function pickDirection() {
    if (state.mode === "mixed") {
      var opts = ["en2zh", "zh2en", "listen"];
      return opts[Math.floor(Math.random() * opts.length)];
    }
    return state.mode;
  }
  function pickCard(excludeId) {
    var pool = getPool();
    var candidates = pool.filter(function (w) { return w.id !== excludeId; });
    var source = candidates.length ? candidates : pool;
    if (!source.length) return null;
    return source[Math.floor(Math.random() * source.length)].id;
  }

  function ensureCurrentCard() {
    if (state.view === "study" && state.currentId === null) {
      state.currentId = pickCard(null);
      state.direction = pickDirection();
    }
  }

  function showToast(msg) {
    state.toast = msg;
    render();
    setTimeout(function () { state.toast = ""; render(); }, 1600);
  }

  function speak(text) {
    if (!text) return;
    if (!("speechSynthesis" in window)) { showToast("此瀏覽器不支援語音朗讀"); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  /* ---------------------------------------------------------------- */
  /* 動作(state 變更)                                                   */
  /* ---------------------------------------------------------------- */
  function switchView(v) {
    state.view = v;
    render();
  }

  function switchMode(m) {
    state.mode = m;
    state.submitted = false;
    state.isCorrect = false;
    state.currentId = pickCard(null);
    state.direction = m === "mixed" ? ["en2zh", "zh2en", "listen"][Math.floor(Math.random() * 3)] : m;
    render();
  }

  function switchCategory(c) {
    state.categoryFilter = c;
    state.submitted = false;
    state.isCorrect = false;
    state.currentId = null;
    ensureCurrentCard();
    render();
  }

  function toggleDueOnly() {
    state.dueOnly = !state.dueOnly;
    state.submitted = false;
    state.isCorrect = false;
    state.currentId = null;
    ensureCurrentCard();
    render();
  }

  function toggleReminders() {
    if (state.remindersOn) {
      state.remindersOn = false;
      saveJSON(REMINDER_KEY, false);
      render();
      return;
    }
    if (typeof Notification === "undefined") { showToast("此瀏覽器不支援通知"); return; }
    Notification.requestPermission().then(function (perm) {
      if (perm !== "granted") { showToast("尚未授權通知權限"); return; }
      state.remindersOn = true;
      saveJSON(REMINDER_KEY, true);
      try { new Notification("字卡櫃 📖", { body: "提醒已開啟！記得每天回來複習，別中斷連續紀錄 🔥" }); } catch (e) {}
      render();
    });
  }

  function checkReminder() {
    if (!state.remindersOn || typeof Notification === "undefined" || Notification.permission !== "granted") return;
    var today = todayStr();
    if (loadJSON(REMINDED_KEY, null) === today) return;
    var dueCount = state.words.filter(function (w) { return w.mastery < 5 && w.nextReview <= today; }).length;
    if (dueCount > 0) {
      try { new Notification("字卡櫃 📖", { body: "今天還有 " + dueCount + " 個單字待複習，別中斷連續 " + state.streak.count + " 天的紀錄！" }); } catch (e) {}
      saveJSON(REMINDED_KEY, today);
    }
  }

  function submitAnswer(e) {
    e.preventDefault();
    var current = getCurrent();
    if (!current || state.submitted) return;
    var input = document.getElementById("answer-input");
    var answer = input ? input.value : "";
    var ok;
    if (state.direction === "listen") {
      ok = normalizeSpelling(answer).length > 0 && normalizeSpelling(answer) === normalizeSpelling(current.term);
    } else {
      var nAns = normalize(answer);
      var target = state.direction === "en2zh" ? current.meaning : current.term;
      var nTarget = normalize(target);
      ok = nAns.length > 0 && (nAns === nTarget || (nAns.length >= 2 && nTarget.includes(nAns)) || (nTarget.length >= 2 && nAns.includes(nTarget)));
    }
    state.isCorrect = ok;
    state.submitted = true;
    render();
  }

  function grade(known) {
    var current = getCurrent();
    if (!current) return;
    var newMastery = known ? Math.min(5, current.mastery + 1) : Math.max(0, current.mastery - 1);
    var today = todayStr();
    current.mastery = newMastery;
    current.lastReviewed = today;
    current.nextReview = addDays(today, INTERVALS[newMastery]);
    persistWords();
    state.streak = computeStreak(state.streak);
    persistStreak();
    state.sessionCount++;
    state.submitted = false;
    state.isCorrect = false;
    state.currentId = pickCard(current.id);
    state.direction = pickDirection();
    render();
  }

  function addWord(e) {
    e.preventDefault();
    var term = document.getElementById("add-term").value.trim();
    var meaning = document.getElementById("add-meaning").value.trim();
    var example = document.getElementById("add-example").value.trim();
    var category = document.getElementById("add-category").value.trim() || "未分類";
    if (!term || !meaning) return;
    var w = { id: "w" + Date.now(), term: term, meaning: meaning, example: example, category: category, mastery: 0, nextReview: todayStr(), lastReviewed: null };
    state.words.unshift(w);
    persistWords();
    render();
    showToast("已加入「" + w.term + "」");
  }

  function deleteWord(id) {
    state.words = state.words.filter(function (w) { return w.id !== id; });
    persistWords();
    if (state.currentId === id) state.currentId = null;
    render();
  }

  function resetProgress(id) {
    var w = state.words.find(function (w) { return w.id === id; });
    if (!w) return;
    w.mastery = 0;
    w.nextReview = todayStr();
    w.lastReviewed = null;
    persistWords();
    render();
  }

  function startEdit(id) {
    state.editingId = id;
    render();
  }
  function cancelEdit() {
    state.editingId = null;
    render();
  }
  function saveEdit(id) {
    var term = document.getElementById("edit-term-" + id).value.trim();
    var meaning = document.getElementById("edit-meaning-" + id).value.trim();
    var example = document.getElementById("edit-example-" + id).value.trim();
    var category = document.getElementById("edit-category-" + id).value.trim() || "未分類";
    if (!term || !meaning) { showToast("單字與中文意思不能空白"); return; }
    var w = state.words.find(function (w) { return w.id === id; });
    if (!w) return;
    w.term = term; w.meaning = meaning; w.example = example; w.category = category;
    persistWords();
    state.editingId = null;
    render();
    showToast("已更新單字");
  }

  /* ---------------------------------------------------------------- */
  /* 畫面渲染                                                           */
  /* ---------------------------------------------------------------- */
  function btnStyle(bg, fg, extra) {
    return "background:" + bg + ";color:" + fg + ";border:" + (bg === "transparent" ? "none" : "none") + ";border-radius:8px;padding:11px 0;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;" + (extra || "");
  }
  var ICON_BTN = "background:transparent;border:1px solid rgba(237,232,220,0.2);border-radius:6px;padding:6px;color:#EDE8DC;cursor:pointer;";
  var EDIT_INPUT = "width:100%;background:rgba(245,241,232,0.06);border:1px solid rgba(237,232,220,0.2);border-radius:6px;padding:6px 8px;color:#EDE8DC;font-size:12px;font-family:inherit;margin-bottom:6px;";

  function renderHeader() {
    return (
      '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;">' +
        '<div><h1 class="serif" style="font-size:26px;margin:0;letter-spacing:0.5px;">字卡櫃</h1>' +
        '<p class="mono" style="font-size:11px;color:#8B93A8;margin:4px 0 0;">CARD·CATALOG — 你的私人單字抽屜</p></div>' +
        '<div style="text-align:right;" class="mono">' +
          '<div style="font-size:12px;color:#8B93A8;">連續學習</div>' +
          '<div style="font-size:20px;color:#E3A34E;">🔥 ' + state.streak.count + ' 天</div>' +
          '<div style="font-size:10px;color:#8B93A8;margin-top:2px;">本次複習 ' + state.sessionCount + ' · 最長 ' + state.streak.longest + ' 天</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderTabs() {
    var tabs = [{ key: "study", label: "📖 學習" }, { key: "manage", label: "📚 單字庫" }, { key: "add", label: "＋ 新增" }];
    var html = '<div style="display:flex;gap:8px;margin-bottom:20px;">';
    tabs.forEach(function (t) {
      var active = state.view === t.key;
      html += '<button data-action="switch-view" data-value="' + t.key + '" style="flex:1;padding:10px 0;border-radius:8px;border:1px solid ' +
        (active ? "#E3A34E" : "rgba(237,232,220,0.15)") + ';background:' + (active ? "rgba(227,163,78,0.14)" : "transparent") +
        ';color:' + (active ? "#E3A34E" : "#EDE8DC") + ';font-size:13px;">' + t.label + '</button>';
    });
    html += '</div>';
    return html;
  }

  function renderCategoryDatalist() {
    var cats = getCategories();
    if (!cats.length) return "";
    var opts = cats.map(function (c) { return '<option value="' + escapeHtml(c) + '"></option>'; }).join("");
    return '<datalist id="category-options">' + opts + '</datalist>';
  }

  function renderEmptyState(msg, sub) {
    return (
      '<div style="text-align:center;padding:50px 20px;border:1px dashed rgba(237,232,220,0.25);border-radius:12px;">' +
        '<p class="serif" style="font-size:18px;margin-bottom:6px;">' + msg + '</p>' +
        '<p style="font-size:13px;color:#8B93A8;margin-bottom:16px;">' + sub + '</p>' +
        '<button data-action="switch-view" data-value="add" style="' + btnStyle("#E3A34E", "#1C2541") + '">＋ 新增單字</button>' +
      '</div>'
    );
  }

  function renderStudyView() {
    ensureCurrentCard();
    var pool = getPool();
    var dueTodayCount = state.words.filter(function (w) {
      return w.mastery < 5 && w.nextReview <= todayStr() && (state.categoryFilter === "all" || w.category === state.categoryFilter);
    }).length;
    var categories = getCategories();

    var html = "";

    // 模式切換
    var modes = [{ key: "en2zh", label: "英 → 中" }, { key: "zh2en", label: "中 → 英" }, { key: "listen", label: "聽力拼字" }, { key: "mixed", label: "混合" }];
    html += '<div style="display:flex;gap:8px;margin-bottom:16px;">';
    modes.forEach(function (m) {
      var active = state.mode === m.key;
      html += '<button class="mono" data-action="switch-mode" data-value="' + m.key + '" style="flex:1;padding:7px 0;border-radius:6px;font-size:12px;border:1px solid ' +
        (active ? "#5B8FBF" : "rgba(237,232,220,0.15)") + ';background:' + (active ? "rgba(91,143,191,0.16)" : "transparent") +
        ';color:' + (active ? "#8FB8E0" : "#8B93A8") + ';">' + m.label + '</button>';
    });
    html += '</div>';

    // 今日待複習 + 開關
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;">' +
      '<span class="mono" style="font-size:11px;color:#8B93A8;">今天待複習 <span style="color:#E3A34E;">' + dueTodayCount + '</span> 個</span>' +
      '<div style="display:flex;gap:6px;">' +
        '<button class="mono" data-action="toggle-due" style="padding:5px 10px;border-radius:20px;font-size:11px;border:1px solid ' +
          (state.dueOnly ? "#7FA87A" : "rgba(237,232,220,0.18)") + ';background:' + (state.dueOnly ? "rgba(127,168,122,0.16)" : "transparent") +
          ';color:' + (state.dueOnly ? "#7FA87A" : "#8B93A8") + ';">' + (state.dueOnly ? "只考今天到期" : "不限到期日") + '</button>' +
        '<button data-action="toggle-reminders" style="padding:5px 10px;border-radius:20px;font-size:12px;border:1px solid ' +
          (state.remindersOn ? "#E3A34E" : "rgba(237,232,220,0.18)") + ';background:' + (state.remindersOn ? "rgba(227,163,78,0.16)" : "transparent") +
          ';color:' + (state.remindersOn ? "#E3A34E" : "#8B93A8") + ';">' + (state.remindersOn ? "🔔" : "🔕") + '</button>' +
      '</div></div>';

    // 分類篩選
    if (categories.length) {
      html += '<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">';
      var allCount = state.words.filter(function (w) { return w.mastery < 5; }).length;
      html += renderCategoryChip("全部 (" + allCount + ")", "all", state.categoryFilter === "all");
      categories.forEach(function (c) {
        var cnt = state.words.filter(function (w) { return w.category === c && w.mastery < 5; }).length;
        html += renderCategoryChip(escapeHtml(c) + " (" + cnt + ")", c, state.categoryFilter === c);
      });
      html += '</div>';
    }

    if (!state.words.length) {
      html += renderEmptyState("抽屜是空的", "新增第一張單字卡，開始建立你的字卡庫。");
      return html;
    }

    if (!pool.length) {
      var title = state.dueOnly ? "今天該複習的都做完了！" : (state.categoryFilter === "all" ? "全部精熟了！" : "「" + escapeHtml(state.categoryFilter) + "」都精熟了！");
      var sub = state.dueOnly ? "做得好！明天會有新的單字到期，或可以繼續練習其他還沒精熟的字。" : (state.categoryFilter === "all" ? "目前抽屜裡的單字都已達到精熟等級。" : "可以切換其他分類繼續複習，或新增更多單字。");
      html += '<div style="text-align:center;padding:50px 20px;border:1px dashed rgba(237,232,220,0.25);border-radius:12px;">' +
        '<p class="serif" style="font-size:20px;margin-bottom:8px;">' + title + '</p>' +
        '<p style="font-size:13px;color:#8B93A8;margin-bottom:16px;">' + sub + '</p>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
        (state.dueOnly ? '<button data-action="toggle-due" style="' + btnStyle("transparent", "#7FA87A", "border:1.5px solid #7FA87A;width:auto;padding:10px 16px;") + '">不限到期日，繼續練習</button>' : "") +
        '<button data-action="switch-view" data-value="add" style="' + btnStyle("#E3A34E", "#1C2541", "width:auto;padding:10px 16px;") + '">新增更多單字</button>' +
        '</div></div>';
      return html;
    }

    var current = getCurrent();
    if (!current) return html;

    var dirLabel = state.direction === "en2zh" ? "英翻中" : (state.direction === "zh2en" ? "中翻英" : "聽力拼字");
    var lvl = levelOf(current.mastery);

    html += '<div style="position:relative;background:#F5F1E8;color:#1C2541;border-radius:10px;min-height:260px;padding:28px 24px;box-shadow:0 18px 40px rgba(0,0,0,0.35);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">' +
      '<div style="position:absolute;top:14px;left:14px;width:12px;height:12px;border-radius:50%;background:#1C2541;box-shadow:inset 0 0 0 2px #F5F1E8;"></div>' +
      '<span class="mono" style="position:absolute;top:16px;right:16px;font-size:10px;padding:3px 8px;border-radius:20px;color:#fff;background:' + lvl.color + ';">' + lvl.label + ' · ' + current.mastery + '/5</span>' +
      '<p class="mono" style="font-size:11px;color:#8B93A8;margin-bottom:10px;">' + escapeHtml(current.category) + ' · ' + dirLabel + '</p>';

    if (state.direction === "en2zh") {
      html += '<button data-action="speak" data-value="' + current.id + '" style="background:transparent;border:none;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:8px;color:inherit;">' +
        '<h2 class="serif" style="font-size:34px;margin:0;word-break:break-word;">' + escapeHtml(current.term) + '</h2><span style="font-size:20px;">🔊</span></button>';
    } else if (state.direction === "zh2en") {
      html += '<h2 class="serif" style="font-size:26px;margin:0;word-break:break-word;">' + escapeHtml(current.meaning) + '</h2>';
    } else {
      html += '<button data-action="speak" data-value="' + current.id + '" style="background:transparent;border:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:inherit;">' +
        '<div style="width:64px;height:64px;border-radius:50%;background:rgba(91,143,191,0.14);display:flex;align-items:center;justify-content:center;"><span style="font-size:28px;">🔊</span></div>' +
        '<span class="mono" style="font-size:11px;color:#5B8FBF;">點擊重新播放</span></button>';
    }

    var promptText = state.direction === "en2zh" ? "請輸入這個單字的中文意思" : (state.direction === "zh2en" ? "請輸入這個意思對應的英文單字" : "仔細聽發音，輸入正確的拼字");
    var placeholder = state.direction === "en2zh" ? "在這裡輸入中文意思..." : (state.direction === "zh2en" ? "type the English word..." : "type what you hear...");

    html += '<p style="font-size:12px;color:#8B93A8;margin-top:18px;">' + promptText + '</p>';

    html += '<form data-action="submit-answer" style="width:100%;margin-top:14px;">' +
      '<input id="answer-input" autocomplete="off" ' + (state.submitted ? "disabled" : "autofocus") + ' placeholder="' + placeholder + '" style="width:100%;text-align:center;font-size:16px;padding:12px 14px;border-radius:8px;border:1.5px solid ' +
      (state.submitted ? (state.isCorrect ? "#7FA87A" : "#D96C4F") : "rgba(28,37,65,0.25)") + ';background:' + (state.submitted ? (state.isCorrect ? "rgba(127,168,122,0.12)" : "rgba(217,108,79,0.1)") : "#fff") + ';color:#1C2541;" />' +
      (!state.submitted ? '<button type="submit" style="' + btnStyle("#1C2541", "#F5F1E8", "margin-top:10px;") + '">送出答案</button>' : "") +
      '</form>';

    if (state.submitted) {
      html += '<div style="margin-top:14px;width:100%;">';
      if (state.direction === "listen") {
        html += '<p class="serif" style="font-size:17px;margin:0;color:' + (state.isCorrect ? "#4C7A49" : "#B4432E") + ';display:flex;align-items:center;justify-content:center;gap:6px;">' +
          (state.isCorrect ? "✓" : "✕") + ' ' + escapeHtml(current.term) +
          ' <span data-action="speak" data-value="' + current.id + '" style="cursor:pointer;margin-left:4px;">🔊</span></p>' +
          '<p style="font-size:14px;color:#4A5568;margin-top:6px;">' + escapeHtml(current.meaning) + '</p>';
      } else {
        html += '<p class="serif" style="font-size:17px;margin:0;color:' + (state.isCorrect ? "#4C7A49" : "#B4432E") + ';display:flex;align-items:center;justify-content:center;gap:6px;">' +
          (state.isCorrect ? "✓ 答對了！" : "✕ 正確答案：" + escapeHtml(state.direction === "en2zh" ? current.meaning : current.term)) +
          (state.direction === "zh2en" ? ' <span data-action="speak" data-value="' + current.id + '" style="cursor:pointer;margin-left:4px;">🔊</span>' : "") +
          '</p>';
      }
      if (current.example) {
        html += '<p style="font-size:13.5px;color:#4A5568;line-height:1.6;font-style:italic;margin-top:10px;">「' + escapeHtml(current.example) + '」</p>';
      }
      html += '</div>';
    }

    html += '</div>'; // 卡片結束

    if (state.submitted) {
      html += '<div style="display:flex;gap:10px;margin-top:16px;">' +
        '<button data-action="grade" data-value="0" style="' + btnStyle("transparent", "#D96C4F", "border:1.5px solid #D96C4F;flex:1;") + '">✕ 算我錯</button>' +
        '<button data-action="grade" data-value="1" style="' + btnStyle("#7FA87A", "#1C2541", "flex:1;") + '">✓ 算我對</button>' +
        '</div>';
    } else {
      html += '<p style="text-align:center;font-size:11px;color:#8B93A8;margin-top:14px;">輸入後按 Enter 或「送出答案」查看結果</p>';
    }
    html += '<p style="text-align:center;font-size:11px;color:#8B93A8;margin-top:8px;">抽屜中還有 ' + pool.length + ' 張卡待複習 · 共 ' + state.words.length + ' 張</p>';

    return html;
  }

  function renderCategoryChip(label, value, active) {
    return '<button class="mono" data-action="switch-category" data-value="' + escapeHtml(value) + '" style="padding:5px 12px;border-radius:20px;font-size:11px;border:1px solid ' +
      (active ? "#E3A34E" : "rgba(237,232,220,0.18)") + ';background:' + (active ? "rgba(227,163,78,0.16)" : "transparent") +
      ';color:' + (active ? "#E3A34E" : "#8B93A8") + ';">' + label + '</button>';
  }

  function renderManageView() {
    var mastered = state.words.filter(function (w) { return w.mastery === 5; }).length;
    var pool = getPool();
    var categories = getCategories();
    var html = "";

    html += '<div style="display:flex;gap:12px;margin-bottom:16px;" class="mono">' +
      statChip("總數", state.words.length, "#EDE8DC") +
      statChip("精熟", mastered, "#7FA87A") +
      statChip("待複習", pool.length, "#E3A34E") +
      '</div>';

    if (categories.length) {
      html += '<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">';
      html += renderCategoryChip("全部", "all", state.categoryFilter === "all");
      categories.forEach(function (c) {
        html += renderCategoryChip(escapeHtml(c), c, state.categoryFilter === c);
      });
      html += '</div>';
    }

    if (!state.words.length) {
      html += renderEmptyState("抽屜是空的", "新增第一張單字卡，開始建立你的字卡庫。");
      return html;
    }

    var list = state.words.filter(function (w) { return state.categoryFilter === "all" || w.category === state.categoryFilter; });
    html += '<div style="display:flex;flex-direction:column;gap:10px;">';
    list.forEach(function (w) {
      var lvl = levelOf(w.mastery);
      html += '<div style="border:1px solid rgba(237,232,220,0.15);border-left:4px solid ' + lvl.color + ';border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:' + (state.editingId === w.id ? "flex-start" : "center") + ';gap:10px;">';

      if (state.editingId === w.id) {
        html += '<div style="flex:1;display:flex;flex-direction:column;gap:0;min-width:0;">' +
          '<input id="edit-term-' + w.id + '" value="' + escapeHtml(w.term) + '" placeholder="單字" style="' + EDIT_INPUT + '" />' +
          '<input id="edit-meaning-' + w.id + '" value="' + escapeHtml(w.meaning) + '" placeholder="中文意思" style="' + EDIT_INPUT + '" />' +
          '<input id="edit-example-' + w.id + '" value="' + escapeHtml(w.example || "") + '" placeholder="例句（選填）" style="' + EDIT_INPUT + '" />' +
          '<input id="edit-category-' + w.id + '" value="' + escapeHtml(w.category || "") + '" placeholder="分類" list="category-options" style="' + EDIT_INPUT + '" />' +
          '<div style="display:flex;gap:6px;margin-top:4px;">' +
            '<button data-action="save-edit" data-value="' + w.id + '" style="' + btnStyle("#7FA87A", "#1C2541", "width:auto;padding:6px 14px;font-size:12px;") + '">儲存</button>' +
            '<button data-action="cancel-edit" style="' + btnStyle("transparent", "#8B93A8", "border:1px solid rgba(237,232,220,0.2);width:auto;padding:6px 14px;font-size:12px;") + '">取消</button>' +
          '</div></div>';
      } else {
        var dueTag = w.mastery === 5 ? "已精熟" : (w.nextReview <= todayStr() ? "今天該複習" : "下次複習 " + w.nextReview);
        var dueColor = w.mastery < 5 && w.nextReview <= todayStr() ? "#E3A34E" : "#5F6B85";
        html += '<div style="min-width:0;">' +
          '<div style="display:flex;align-items:baseline;gap:8px;">' +
            '<span class="serif" style="font-size:17px;">' + escapeHtml(w.term) + '</span>' +
            '<span class="mono" style="font-size:10px;color:#8B93A8;">' + escapeHtml(w.category) + '</span>' +
          '</div>' +
          '<div style="font-size:13px;color:#C9C3B5;margin-top:2px;">' + escapeHtml(w.meaning) + '</div>' +
          '<div class="mono" style="font-size:10px;color:' + dueColor + ';margin-top:4px;">' + dueTag + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:6px;flex-shrink:0;">' +
          '<button data-action="speak" data-value="' + w.id + '" title="發音" style="' + ICON_BTN + '">🔊</button>' +
          '<button data-action="start-edit" data-value="' + w.id + '" title="編輯" style="' + ICON_BTN + '">✎</button>' +
          '<button data-action="reset-progress" data-value="' + w.id + '" title="重設進度" style="' + ICON_BTN + '">↺</button>' +
          '<button data-action="delete-word" data-value="' + w.id + '" title="刪除" style="' + ICON_BTN + 'color:#D96C4F;">🗑</button>' +
        '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function statChip(label, value, color) {
    return '<div style="flex:1;text-align:center;border:1px solid rgba(237,232,220,0.15);border-radius:8px;padding:8px 0;">' +
      '<div style="font-size:18px;color:' + color + ';">' + value + '</div>' +
      '<div style="font-size:10px;color:#8B93A8;">' + label + '</div></div>';
  }

  function renderAddView() {
    return '<form data-action="add-word" style="display:flex;flex-direction:column;gap:12px;">' +
      field("單字 *", "add-term", "例如：resilient") +
      field("中文意思 *", "add-meaning", "例如：有韌性的") +
      field("例句", "add-example", "選填", true) +
      field("分類", "add-category", "選擇現有分類，或輸入新分類", false, "category-options") +
      '<button type="submit" style="' + btnStyle("#E3A34E", "#1C2541") + '">＋ 加入抽屜</button>' +
      '</form>';
  }

  function field(label, id, placeholder, textarea, listId) {
    var tag = textarea ? "textarea" : "input";
    var extra = textarea ? ' rows="3"' : "";
    var listAttr = listId ? ' list="' + listId + '"' : "";
    return '<label style="display:block;">' +
      '<span style="font-size:12px;color:#8B93A8;display:block;margin-bottom:5px;">' + label + '</span>' +
      '<' + tag + ' id="' + id + '" placeholder="' + placeholder + '"' + extra + listAttr +
      ' style="width:100%;background:rgba(245,241,232,0.06);border:1px solid rgba(237,232,220,0.2);border-radius:8px;padding:10px 12px;color:#EDE8DC;font-size:14px;font-family:inherit;' + (textarea ? "resize:vertical;" : "") + '"></' + tag + '>' +
      '</label>';
  }

  function render() {
    var container = document.getElementById("app");
    var html =
      '<div style="background:#1C2541;background-image:radial-gradient(circle at 20% 10%, rgba(227,163,78,0.08), transparent 40%), radial-gradient(circle at 80% 90%, rgba(127,168,122,0.06), transparent 40%);color:#EDE8DC;padding:28px 16px 60px;min-height:100vh;">' +
        '<div style="max-width:480px;margin:0 auto;">' +
          renderHeader() +
          renderTabs() +
          renderCategoryDatalist() +
          (state.view === "study" ? renderStudyView() : state.view === "manage" ? renderManageView() : renderAddView()) +
        '</div>' +
        (state.toast ? '<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#F5F1E8;color:#1C2541;padding:8px 16px;border-radius:20px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,0.3);">' + escapeHtml(state.toast) + '</div>' : "") +
      '</div>';
    container.innerHTML = html;
    checkReminder();
  }

  /* ---------------------------------------------------------------- */
  /* 事件委派(只綁定一次)                                               */
  /* ---------------------------------------------------------------- */
  document.addEventListener("DOMContentLoaded", function () {
    var app = document.getElementById("app");

    app.addEventListener("click", function (e) {
      var el = e.target.closest("[data-action]");
      if (!el) return;
      var action = el.getAttribute("data-action");
      var value = el.getAttribute("data-value");
      switch (action) {
        case "switch-view": switchView(value); break;
        case "switch-mode": switchMode(value); break;
        case "switch-category": switchCategory(value); break;
        case "toggle-due": toggleDueOnly(); break;
        case "toggle-reminders": toggleReminders(); break;
        case "speak": {
          var w = state.words.find(function (w) { return String(w.id) === String(value); });
          if (w) speak(w.term);
          break;
        }
        case "grade": grade(value === "1"); break;
        case "delete-word": deleteWord(value); break;
        case "reset-progress": resetProgress(value); break;
        case "start-edit": startEdit(value); break;
        case "cancel-edit": cancelEdit(); break;
        case "save-edit": saveEdit(value); break;
      }
    });

    app.addEventListener("submit", function (e) {
      var el = e.target.closest("[data-action]");
      if (!el) return;
      var action = el.getAttribute("data-action");
      if (action === "submit-answer") submitAnswer(e);
      if (action === "add-word") addWord(e);
    });

    render();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
